apiVersion: apps/v1
kind: Deployment
metadata:
  name: santa-deployment
spec:
  selector:
    matchLabels:
      app: santa
  replicas: 2
  template:
    metadata:
      labels:
        app: santa
    spec:
      containers:
        - name: santa
          image: 202533525867.dkr.ecr.us-east-1.amazonaws.com/prokopto-ecr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
